// Base do modo Equipe x Equipe da aba Diversão.
// Quem morre renasce na base, e vence o time com mais abates em 10 minutos.
sv_cheats 0
bot_quota 0

// Dois times de verdade, equilibrados.
mp_teammates_are_enemies 0
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 1

// Quem morre volta na hora, na base do próprio time.
mp_randomspawn 0
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_respawnwavetime_ct 0
mp_respawnwavetime_t 0
mp_respawn_immunitytime 3

// A câmera de morte seguraria cerca de 4 segundos antes de renascer.
spec_freeze_time 0
spec_freeze_deathanim_time 0
spec_freeze_traveltime 0
spec_freeze_time_lock 0

// A cada renascimento: M4 ou AK, pistola padrão e o kit de granadas.
mp_ct_default_primary weapon_m4a1
mp_t_default_primary weapon_ak47
mp_ct_default_secondary weapon_hkp2000
mp_t_default_secondary weapon_glock
mp_ct_default_melee weapon_knife
mp_t_default_melee weapon_knife
mp_ct_default_grenades "weapon_smokegrenade weapon_flashbang weapon_hegrenade"
mp_t_default_grenades "weapon_smokegrenade weapon_flashbang weapon_hegrenade"
mp_free_armor 2

// Ninguém compra nem pega outra arma do chão.
mp_buytime 0
mp_buy_anywhere 1
mp_buy_during_immunity 0
sv_buy_status_override 3
mp_startmoney 0
mp_maxmoney 0
mp_playercashawards 0
mp_teamcashawards 0
mp_weapons_allow_map_placed 0
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_taser 0
mp_death_drop_defuser 0
mp_give_player_c4 0

// Este modo do jogo não traz o comportamento de caça dos bots. Aqui ele vale só para os testes com bots.
mp_bot_ai_bt "scripts/ai/deathmatch/bt_default.kv3"

// Quem encerra a partida é o plugin, que decide por abates. O tempo do jogo fica um minuto acima, só para não atrapalhar.
// Com mp_timelimit e mp_maxrounds zerados juntos, este modo congela todo mundo como partida encerrada.
mp_ignore_round_win_conditions 1
mp_roundtime 11
mp_roundtime_defuse 0
mp_roundtime_hostage 0
mp_timelimit 0
mp_maxrounds 1
mp_winlimit 0
mp_halftime 0
mp_freezetime 0
mp_warmuptime 0
mp_match_can_clinch 0
mp_endmatch_votenextmap 0
mp_match_end_changelevel 0
mp_match_end_restart 1
mp_match_restart_delay 5
