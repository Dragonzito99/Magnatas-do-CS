hostname "Magnatas do CS | Laboratório de mutantes"

// Vem depois do mutacao_base.cfg e só muda o que o laboratório precisa. Quem manda na rodada é o plugin.
// Com cheats, o Adm usa thirdperson, firstperson e noclip no console, e os bots ficam parados.
sv_cheats 1

// Bots só quando o Adm chama (!bot), parados e sem atirar até ele mandar andar (!parar).
bot_quota 0
bot_quota_mode normal
bot_join_after_player 0
bot_stop 1
bot_dont_shoot 1
mp_autokick 0

// Uma hora no relógio da tela; a rodada só acaba se o plugin mandar, e no laboratório ele nunca manda.
mp_roundtime 60
mp_ignore_round_win_conditions 1
