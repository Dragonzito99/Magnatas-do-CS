// Base dos servidores Cada um por si da aba Diversão.
// A configuração de cada servidor vem depois desta e pode trocar qualquer linha.
sv_cheats 0
bot_quota 0

// Sem times, e quem morre volta na hora em outro lugar do mapa.
mp_teammates_are_enemies 1
mp_randomspawn 1
mp_randomspawn_los 1
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_respawnwavetime_ct 0
mp_respawnwavetime_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_friendlyfire 1

// A arma principal vem do plugin, porque este modo do jogo ignora a arma principal padrão.
mp_ct_default_melee weapon_knife
mp_t_default_melee weapon_knife
mp_free_armor 2

// Ninguém compra nem pega outra arma do chão.
// Fora da zona de compra, os bots ficam parados tentando comprar. Por isso a zona fica liberada e a compra fica bloqueada.
mp_buytime 0
mp_buy_anywhere 1
mp_buy_during_immunity 0
sv_buy_status_override 3
mp_startmoney 0
mp_maxmoney 0
mp_weapons_allow_map_placed 0
mp_weapons_allow_zeus 0
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_taser 0
mp_death_drop_defuser 0

// O modo mata-mata do jogo dá bônus por arma e seringa por abates, e aqui a arma é sempre a do servidor.
mp_dm_bonus_length_max 0
mp_dm_bonus_length_min 0
mp_dm_bonus_percent 0
mp_dm_healthshot_killcount 9999

// A partida nunca acaba pelo tempo do jogo: neste modo, o fim deixa todo mundo sem time e nada recomeça.
// Quem zera o placar é o plugin, a cada 20 minutos.
mp_timelimit 0
mp_roundtime 60
mp_maxrounds 0
mp_winlimit 0
mp_match_can_clinch 0
mp_warmuptime 0
