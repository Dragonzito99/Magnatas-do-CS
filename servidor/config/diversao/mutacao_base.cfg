// Base do modo Mutação da aba Diversão.
// Todos nascem humanos (CT), e virar mutante é passar para TR sem morrer. Quem sorteia, transforma e encerra é o plugin.
sv_cheats 0
bot_quota 0

// Até 16 pessoas, todas do mesmo lado no início da rodada.
mp_teammates_are_enemies 0
mp_friendlyfire 0
mp_autoteambalance 0
mp_limitteams 0
mp_humanteam ct
mp_force_assign_teams 1
mp_randomspawn 0

// Quem morre volta pelo plugin. Se o jogo também renascesse, os dois disputariam.
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0

// A câmera de morte seguraria cerca de 4 segundos antes de renascer.
spec_freeze_time 0
spec_freeze_deathanim_time 0
spec_freeze_traveltime 0
spec_freeze_time_lock 0

// Humano com pistola e a faca do jogo. A AK ou a M4 vêm do plugin, por sorteio. Mutante só com a faca.
mp_ct_default_primary ""
mp_ct_default_secondary weapon_hkp2000
mp_ct_default_melee weapon_knife
mp_ct_default_grenades ""
mp_t_default_primary ""
mp_t_default_secondary null
mp_t_default_melee weapon_knife
mp_t_default_grenades ""
// Sem colete, para o tiro valer inteiro contra o mutante.
mp_free_armor 0

// Ninguém compra nem pega outra arma do chão.
mp_buytime 0
mp_buy_anywhere 1
mp_buy_during_immunity 0
sv_buy_status_override 3
mp_startmoney 0
mp_maxmoney 0
mp_playercashawards 0
mp_teamcashawards 0
mp_weapons_allow_map_placed 0
mp_death_drop_gun 0
// Sem isso, o jogo nem manda o G de quem só tem a faca, e o poder do mutante não funcionava. O plugin segura a faca.
mp_drop_knife_enable 1
mp_death_drop_grenade 0
mp_death_drop_taser 0
mp_death_drop_defuser 0
mp_give_player_c4 0

// Este modo do jogo não traz o comportamento de caça dos bots. Aqui ele vale só para os testes com bots.
mp_bot_ai_bt "scripts/ai/deathmatch/bt_default.kv3"

// Quem encerra a rodada é o plugin. O relógio da tela mostra os mesmos 3 minutos, e o jogo não encerra sozinho.
// Com mp_timelimit e mp_maxrounds zerados juntos, este modo congela todo mundo como partida encerrada.
mp_ignore_round_win_conditions 1
mp_roundtime 3
mp_roundtime_defuse 0
mp_roundtime_hostage 0
mp_timelimit 0
mp_maxrounds 1
mp_winlimit 0
mp_halftime 0
mp_freezetime 0
mp_match_can_clinch 0
mp_warmuptime 0
// Sem estas duas, o jogo faz 1 minuto de aquecimento depois de cada partida.
mp_warmuptime_all_players_connected 0
mp_warmup_online_enabled 0
mp_endmatch_votenextmap 0
mp_match_end_changelevel 0
mp_match_end_restart 1
mp_match_restart_delay 5

// Sons de abate: o pacote da Oficina que todo jogador baixa ao entrar (MultiAddonManager).
// O segundo é o pacote do mutante (um item novo para cada versão do boneco).
mm_extra_addons "3835000213,3836643990,3837109609,3837571705,3837859077"
// Baixa a versão nova do pacote ao montar: sem isso, o servidor ficava para sempre com a primeira que baixou.
mm_addon_mount_download 1
// Guarda quem já tem o pacote, para a troca de mapa não reconectar ninguém.
mm_cache_clients_with_addons 1
