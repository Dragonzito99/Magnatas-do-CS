hostname "Magnatas do CS | Laboratório de personagens"

// Vem depois do cada_um_por_si.cfg e só muda o que o laboratório precisa.
// Com cheats, o Adm usa thirdperson, firstperson e noclip no console, e os bots ficam parados.
sv_cheats 1

// Bots só quando o Adm chama (!bot), parados e sem atirar até ele mandar andar (!parar).
bot_quota 0
bot_quota_mode normal
bot_join_after_player 0
bot_stop 1
bot_dont_shoot 1
mp_autokick 0

// Compra qualquer arma, em qualquer lugar e a qualquer hora, sem acabar a munição. A base trava a compra (3); -1 libera.
sv_buy_status_override -1
mp_buytime 99999
mp_startmoney 16000
mp_maxmoney 16000
mp_afterroundmoney 16000
sv_infinite_ammo 1

// Se o tempo do mata-mata acabar, a partida recomeça em vez de deixar todo mundo parado.
mp_match_end_restart 1
mp_match_restart_delay 3
