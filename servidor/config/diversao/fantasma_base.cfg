// Base do modo Fantasma da aba Diversão.
// A invisibilidade, os áudios e a bomba são do script do mapa gm_laboratory, que também traz velocidade, pulo e radar desligado.
sv_cheats 0
bot_quota 0

// Até 8 de cada lado, sem dano em colega.
mp_teammates_are_enemies 0
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 1

// Quem morre só volta na rodada seguinte.
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0

// CT com kit fixo. Fantasma só com faca e, um deles, a bomba. O kit de defuse é sorteado pelo plugin.
mp_ct_default_primary weapon_m4a1_silencer
mp_ct_default_secondary weapon_usp_silencer
mp_ct_default_melee weapon_knife
mp_ct_default_grenades "weapon_smokegrenade weapon_flashbang weapon_hegrenade"
mp_t_default_primary ""
mp_t_default_secondary null
mp_t_default_melee weapon_knife
mp_t_default_grenades ""
mp_free_armor 2
mp_give_player_c4 1

// Ninguém compra, e arma de quem morre não vai para o chão, para o fantasma não pegar.
sv_buy_status_override 3
mp_buy_anywhere 0
mp_buy_during_immunity 0
mp_weapons_allow_map_placed 0
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_taser 0

// 13 rodadas, troca de lados depois da 6ª e fim quando um time chega a 7 vitórias.
mp_maxrounds 13
mp_halftime 1
mp_match_can_clinch 1
mp_overtime_enable 0
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_freezetime 5
mp_timelimit 0
mp_winlimit 0
mp_warmuptime 0

// Ao fim, 15 segundos para ler o resultado e a partida recomeça sozinha, no mesmo mapa.
mp_endmatch_votenextmap 0
mp_match_end_changelevel 0
mp_match_end_restart 1
mp_match_restart_delay 15
