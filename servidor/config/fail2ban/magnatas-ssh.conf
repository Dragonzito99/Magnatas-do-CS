# Robôs tentavam a senha do root mais de 10 mil vezes por dia (11/11/2026). Quem errar a senha 5 vezes em 10 minutos
# fica 1 hora sem conseguir entrar. O login por senha continua, a pedido do dono; o login por chave não conta erro.
[sshd]
enabled = true
backend = systemd
maxretry = 5
findtime = 10m
bantime = 1h
