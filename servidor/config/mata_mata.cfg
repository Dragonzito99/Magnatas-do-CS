// Modo Cada um por si da aba Diversão: Dust 2, só AK e Desert.
hostname "Magnatas do CS | Cada um por si"
sv_cheats 0
bot_quota 0

// Sem times, e quem morre volta na hora em outro lugar do mapa.
mp_teammates_are_enemies 1
mp_randomspawn 1
mp_randomspawn_los 1
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_respawnwavetime_ct 0
mp_respawnwavetime_t 0
mp_autoteambalance 0
mp_limitteams 0
mp_friendlyfire 1

// Todo mundo igual: AK, Desert e faca.
mp_ct_default_primary weapon_ak47
mp_t_default_primary weapon_ak47
mp_ct_default_secondary weapon_deagle
mp_t_default_secondary weapon_deagle
mp_ct_default_melee weapon_knife
mp_t_default_melee weapon_knife
mp_free_armor 2

// Ninguém compra nem pega outra arma do chão.
mp_buytime 0
mp_buy_anywhere 0
mp_startmoney 0
mp_maxmoney 0
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_taser 0
mp_death_drop_defuser 0

// O modo mata-mata do jogo dá bônus por arma, e aqui é sempre AK e Desert.
mp_dm_bonus_length_max 0
mp_dm_bonus_length_min 0
mp_dm_bonus_percent 0

// A cada 20 minutos o placar zera, sem trocar de mapa nem abrir votação.
mp_timelimit 20
mp_maxrounds 0
mp_winlimit 0
mp_match_can_clinch 0
mp_endmatch_votenextmap 0
mp_match_end_changelevel 0
mp_match_end_restart 1
mp_match_restart_delay 5
mp_warmuptime 0
