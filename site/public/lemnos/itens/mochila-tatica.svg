<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="corpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a40"/>
      <stop offset="0.55" stop-color="#26262b"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="bolso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- sombra no chão -->
  <ellipse cx="64" cy="118" rx="38" ry="6" fill="#000" opacity="0.45"/>
  <!-- alça de mão -->
  <path d="M52 16 C52 6 76 6 76 16" fill="none" stroke="#1c1c21" stroke-width="5" stroke-linecap="round"/>
  <!-- alças laterais (de costas) aparecendo -->
  <path d="M30 34 C22 50 22 80 28 104" fill="none" stroke="#1c1c21" stroke-width="6" stroke-linecap="round"/>
  <path d="M98 34 C106 50 106 80 100 104" fill="none" stroke="#1c1c21" stroke-width="6" stroke-linecap="round"/>
  <!-- corpo -->
  <path d="M34 22 Q34 14 44 14 H84 Q94 14 94 22 L98 104 Q98 112 90 112 H38 Q30 112 30 104 Z" fill="url(#corpo)" stroke="#141418" stroke-width="2"/>
  <!-- tampa -->
  <path d="M34 22 Q34 14 44 14 H84 Q94 14 94 22 V40 Q64 46 34 40 Z" fill="#26262b" stroke="#141418" stroke-width="2"/>
  <path d="M38 38 Q64 43 90 38" fill="none" stroke="#141418" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- faixas de tecido para pendurar equipamento -->
  <g fill="none" stroke="#1c1c21" stroke-width="3">
    <path d="M38 52 H90"/>
    <path d="M38 60 H90"/>
  </g>
  <g fill="#141418">
    <rect x="46" y="50" width="3" height="12"/>
    <rect x="62" y="50" width="3" height="12"/>
    <rect x="78" y="50" width="3" height="12"/>
  </g>
  <!-- bolso da frente -->
  <path d="M42 70 H86 Q90 70 90 74 V100 Q90 106 84 106 H44 Q38 106 38 100 V74 Q38 70 42 70 Z" fill="url(#bolso)" stroke="#141418" stroke-width="2"/>
  <path d="M42 70 H86 Q90 70 90 74 V82 Q64 88 38 82 V74 Q38 70 42 70 Z" fill="#26262b" stroke="#141418" stroke-width="1.5"/>
  <path d="M42 80 Q64 85 86 80" fill="none" stroke="#141418" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- tiras de compressão com fivelas -->
  <g stroke="#1c1c21" stroke-width="5">
    <path d="M52 20 V46"/>
    <path d="M76 20 V46"/>
  </g>
  <g fill="#f5b301" stroke="#141418" stroke-width="1">
    <rect x="48" y="42" width="8" height="7" rx="1.5"/>
    <rect x="72" y="42" width="8" height="7" rx="1.5"/>
    <rect x="58" y="80" width="12" height="7" rx="1.5"/>
  </g>
  <path d="M64 87 V100" stroke="#1c1c21" stroke-width="4"/>
  <!-- etiqueta de velcro -->
  <rect x="56" y="24" width="16" height="9" rx="1.5" fill="#141418" opacity="0.8"/>
  <!-- luz de cima -->
  <path d="M34 22 Q34 14 44 14 H84 Q94 14 94 22 L98 104 Q98 112 90 112 H38 Q30 112 30 104 Z" fill="url(#brilho)"/>
</svg>
